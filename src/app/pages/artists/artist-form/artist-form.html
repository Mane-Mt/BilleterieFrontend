<div class="artist-form-container">
  <h2>{{ isEditMode ? 'Modifier un artiste' : 'Créer un artiste' }}</h2>

  <div class="form-group">
    <label>Prénom</label>
    <input type="text" [(ngModel)]="firstname" placeholder="Prénom" />
  </div>

  <div class="form-group">
    <label>Nom</label>
    <input type="text" [(ngModel)]="lastname" placeholder="Nom" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="email"
      placeholder="exemple@email.com"
    />
    @if (email && !isValidEmail()) {
      <span class="error">Email invalide</span>
    }
  </div>

  <div class="form-group">
    <label>Téléphone</label>
    <input
      type="tel"
      [(ngModel)]="phone"
      placeholder="0612345678"
      maxlength="10"
    />
    @if (phone && !isValidPhone()) {
      <span class="error">Téléphone invalide — 10 chiffres requis</span>
    }
  </div>

  <div class="form-actions">
    <button class="btn-submit" (click)="submit()">
      {{ isEditMode ? 'Modifier' : 'Créer' }}
    </button>
    <button class="btn-cancel" (click)="cancel()">Annuler</button>
  </div>
</div>
