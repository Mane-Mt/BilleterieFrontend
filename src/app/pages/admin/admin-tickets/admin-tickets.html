<div class="ticket-list-container">
  
  <div class="table-actions">
    <!-- <button class="btn-create" routerLink="/tickets/create">+ Créer un ticket</button> -->
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Acheteur (Email)</th>
          <th>Concert</th>
          <th>Quantité</th>
          <th>Prix Total</th>
          <!-- <th>Actions</th> -->
        </tr>
      </thead>
      <tbody>
        @for (ticket of tickets(); track ticket.id) {
          <tr>
            <td data-label="ID">{{ ticket.id }}</td>
            <td data-label="Acheteur (Email)"><strong>{{ ticket.buyerEmail }}</strong></td>
            <td data-label="Concert">{{ ticket.concert.name  }}</td>
            <td data-label="Quantité">
              <span class="quantity-badge">{{ ticket.quantity }}</span>
            </td>
            <td data-label="Prix Total"><strong class="price">{{ (ticket.concert.price * ticket.quantity)| number:'1.2-2' }}€</strong></td>
            <!-- <td data-label="Actions">
              <div class="row-actions">
                <a class="btn-voir" routerLink="/tickets/{{ ticket.id }}">Voir</a>
                
              </div>
            </td> -->
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="td-empty">Aucun ticket enregistré</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
