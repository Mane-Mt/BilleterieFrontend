<div class="dashboard-container">
  <h2>Tableau de bord</h2>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-icon">🎵</span>
      <span class="stat-value">{{ totalConcerts() }}</span>
      <span class="stat-label">Concerts</span>
    </div>

    <div class="stat-card">
      <span class="stat-icon">👤</span>
      <span class="stat-value">{{ totalUsers() }}</span>
      <span class="stat-label">Utilisateurs</span>
    </div>

    <div class="stat-card">
      <span class="stat-icon">🎪</span>
      <span class="stat-value">{{ totalOrganizers() }}</span>
      <span class="stat-label">Organisateurs</span>
    </div>

    <div class="stat-card">
      <span class="stat-icon">🎟️</span>
      <span class="stat-value">{{ totalTickets() }}</span>
      <span class="stat-label">Tickets</span>
    </div>
  </div>

  <div class="dashboard-actions">
    <button class="btn-manage" (click)="goToConcerts()">
      Gérer les concerts
    </button>
  </div>
</div>
