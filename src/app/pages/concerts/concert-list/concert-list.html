    </div>
   }

  <!-- List -->
   @for (concert of concerts(); track concert.name) {
  <div  class="concerts-list">
    <div class="concert-row"  [routerLink]="['/concerts', concert.id]">
      <div class="concert-row__thumb"> 🎤 </div>
      <div class="concert-row__info">
        <span class="concert-row__artist">{{ concert.name }}</span>
        <span class="concert-row__venue">
          <mat-icon>location_on</mat-icon>
          {{ concert.location }} 
          <!-- · {{ concert.date | date:'d MMMM yyyy':'':'fr' }} -->
        </span>
      </div>
      <div class="concert-row__genre">{{ concert.musicalGenre }}</div>
      <div class="concert-row__right">
        <span class="concert-row__price">{{ concert.price }} €</span>
        <!-- <span class="badge" [ngClass]="getAvailabilityClass(concert)">{{ getAvailabilityLabel(concert) }}</span> -->
      </div>
      <mat-icon class="concert-row__arrow">chevron_right</mat-icon>
    </div>
  </div>
  }

    
</div>
