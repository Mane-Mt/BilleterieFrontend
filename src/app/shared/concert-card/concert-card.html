<mat-card class="concert-card" [routerLink]="['/concerts', concert]"> 
    <!-- concert.id -->
  <div class="concert-card__cover">
    <span class="concert-card__emoji">{{ concert.name }}</span>
    <span class="concert-card__genre-badge">{{ concert.musicalGenre }}</span>
  </div>
 
  <mat-card-content class="concert-card__content">
    <h3 class="concert-card__artist">{{ concert.name }}</h3>
    <p class="concert-card__venue">
      <mat-icon>location_on</mat-icon>
      {{ concert.location }} · 
      <!-- {{ concert. | date:'d MMM':'':'fr' }} -->
    </p>
 
    <div class="concert-card__footer">
      <span class="concert-card__price">{{ concert.price }} €</span>
      <div class="concert-card__meta">
        <span class="badge" [ngClass]="availabilityClass">{{ availabilityLabel }}</span>
        <span class="concert-card__days">J-{{ daysUntil }}</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
