<nav>
  <a routerLink="/">Accueil</a>
  <a routerLink="/concerts">Concerts</a>
  <a routerLink="/users">Utilisateurs</a>
</nav>

<div class="user-form-container">
  <h2>{{ isEditMode ? 'Modifier un utilisateur' : 'Créer un utilisateur' }}</h2>

  <div class="form-group">
    <label>Prénom</label>
    <input type="text" [(ngModel)]="firstname" placeholder="Prénom" />
  </div>

  <div class="form-group">
    <label>Nom</label>
    <input type="text" [(ngModel)]="lastname" placeholder="Nom" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" placeholder="Email" />
  </div>

  <div class="form-group">
    <label>Téléphone</label>
    <input type="text" [(ngModel)]="phone" placeholder="Téléphone" />
  </div>

  <div class="form-actions">
    <button class="btn-submit" (click)="submit()">
      {{ isEditMode ? 'Modifier' : 'Créer' }}
    </button>
    <button class="btn-cancel" (click)="cancel()">Annuler</button>
  </div>
</div>
