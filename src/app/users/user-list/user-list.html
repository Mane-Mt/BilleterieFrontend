<div class="user-list-container">
  <h2>Liste des utilisateurs</h2>
  
  <button routerLink="/users/create">+ Créer un utilisateur</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.firstname }}</td>
          <td>{{ user.lastname }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td>
            <button routerLink="/users/{{ user.id }}">Voir</button>
            <button routerLink="/users/{{ user.id }}/edit">Modifier</button>
            <button (click)="deleteUser(user.id!)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
