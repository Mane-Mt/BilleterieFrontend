<nav>
  <a routerLink="/">Accueil</a>
  <a routerLink="/concerts">Concerts</a>
  <a routerLink="/users">Utilisateurs</a>
</nav>

<div class="user-list-container">
  <h2>Liste des utilisateurs</h2>
  
  <button class="btn-create" routerLink="/users/create">+ Créer un utilisateur</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.firstname }}</td>
          <td>{{ user.lastname }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td>
            <a class="btn-voir" routerLink="/users/{{ user.id }}">Voir</a>
            <a class="btn-modifier" routerLink="/users/{{ user.id }}/edit">Modifier</a>
            <button class="btn-supprimer" (click)="deleteUser(user.id!)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
